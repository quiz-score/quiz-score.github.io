<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SCORE ROOM｜クイズ得点共有</title>
<meta name="theme-color" content="#f6f7fb">
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e7eb;--tx:#111827;--mut:#6b7280;--ac:#4f46e5;--acs:#eef2ff;--ok:#10b981;--ng:#f43f5e;--win:#f59e0b;--rest:#8b5cf6;--sh:0 1px 2px #0000000d,0 4px 14px #0000000a}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f19;--card:#151b2b;--line:#263045;--tx:#f3f4f6;--mut:#9ca3af;--acs:#1e1b4b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--tx)}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:720px;margin:0 auto}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.04em;flex:1}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:700;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}.chip.on .dot{background:var(--ok)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:16px;background:var(--acs);color:var(--ac)}
.btn.pri{background:var(--ac);color:#fff}.btn:disabled{opacity:.4}
.field{width:100%;padding:15px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.field:focus{border-color:var(--ac)}
.lbl{font-size:13px;color:var(--mut);font-weight:700;margin:0 0 8px}
.hero{text-align:center;padding:26px 0 10px}.hero .logo{font-size:30px;font-weight:900;letter-spacing:.06em}.hero p{color:var(--mut);margin:6px 0 0;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:6px 0 14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
/* stepper header */
.steps{display:flex;gap:6px;margin:0 0 14px}.steps div{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps div.on{background:var(--ac)}
/* rule picker */
.search{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:700;white-space:nowrap;color:var(--mut)}
.chips button.on{background:var(--ac);color:#fff}
.rlist{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}.ritem .ic{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.ritem b{display:block;font-size:15px}.ritem small{color:var(--mut);font-size:12.5px}.ritem .ar{margin-left:auto;color:var(--mut)}
.ritem.sel{background:var(--acs)}
/* stepper inputs */
.prm{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.prm:last-child{border-bottom:0}
.prm span{font-weight:700;font-size:15px}
.stp{display:flex;align-items:center;gap:4px}.stp button{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);font-size:22px;font-weight:800}
.stp output{min-width:46px;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.tog:last-child{border-bottom:0}.tog span{font-size:14px;font-weight:600}
.sw{position:relative;width:50px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}.sw i:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}.sw input:checked+i{background:var(--ac)}.sw input:checked+i:before{transform:translateX(20px)}
.desc{background:var(--acs);color:var(--tx);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin-bottom:14px}
/* members */
.mem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.mem:last-child{border-bottom:0}
.mem .no{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.mem input{flex:1;border:0;background:none;font-size:16px;padding:8px 4px;outline:none;min-width:0}
.mem .v{width:58px;flex:none;border:1.5px solid var(--line);border-radius:10px;text-align:center;padding:6px}
.mem .x{width:34px;height:34px;border-radius:10px;color:var(--mut);font-size:18px;flex:none}
.guest{display:inline-flex;gap:6px;align-items:center;margin:0 8px 8px 0;padding:8px 12px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:700;font-size:13px}
/* bottom action */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
/* game */
.gbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font-size:13px;font-weight:800;color:var(--mut)}.rname{font-size:13px;font-weight:700;color:var(--mut);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{border-radius:14px;padding:11px 14px;font-weight:800;font-size:14px;margin-bottom:12px;background:#fff7ed;color:#c2410c}
.alert.end{background:#fef3c7;color:#92400e;font-size:16px;text-align:center}
@media (prefers-color-scheme:dark){.alert{background:#431407;color:#fdba74}.alert.end{background:#422006;color:#fcd34d}}
.players{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.pl{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden;border:2.5px solid transparent;transition:transform .15s}
.pl .hd{display:flex;align-items:center;gap:6px;padding:12px 12px 0}.pl .nm{font-weight:800;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pl .mn{font-size:46px;font-weight:900;text-align:center;line-height:1.05;padding:6px 8px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pl .sb{text-align:center;color:var(--mut);font-size:12.5px;min-height:18px;padding:2px 8px 10px;font-weight:600}
.pl .tot{display:flex;justify-content:center;gap:12px;font-size:12px;font-weight:800;padding:0 0 10px;color:var(--mut)}.pl .tot span:first-child{color:var(--ok)}.pl .tot span:last-child{color:var(--ng)}
.pl .bt{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pl .bt button{padding:16px 0;font-size:24px;font-weight:900}.pl .bt .o{color:var(--ok)}.pl .bt .x{color:var(--ng);border-left:1px solid var(--line)}
.pl .bt button:active{background:var(--acs)}.pl .bt button:disabled{opacity:.25}
.pl.me{border-color:var(--ac)}
.pl.win{border-color:var(--win)}.pl.win .mn{color:var(--win)}.pl.lose{opacity:.45}.pl.rest{border-color:var(--rest)}
.pl.rw .tag{background:#ffedd5;color:#c2410c}.t-win{background:var(--win);color:#fff}.t-lose{background:var(--ng);color:#fff}.t-rest{background:var(--rest);color:#fff}.t-reach{background:#fb923c;color:#fff}
.pl.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.05)}}
.timer{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.gfoot{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;max-width:720px;margin:0 auto}
.gfoot button{padding:15px 0;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:15px}
.gfoot .thr{background:var(--ac);color:#fff}
.log{font-size:13px;color:var(--mut);line-height:1.8;max-height:160px;overflow:auto}
/* sheet */
.mask{position:fixed;inset:0;background:#0006;z-index:30;opacity:0;pointer-events:none;transition:.2s}.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:.25s;max-height:85vh;overflow:auto}
.sheet.on{transform:none}.sheet .in{max-width:720px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:17px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;text-align:left}.mi:last-child{border-bottom:0}.mi .e{width:26px;text-align:center;font-size:18px}
.mi.danger{color:var(--ng)}
.pickg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pickg button{padding:16px;border-radius:14px;background:var(--acs);font-weight:800}
.roomid{font-size:44px;font-weight:900;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 14px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);z-index:50;background:#111827;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:.3s;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.celebrate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;opacity:0;transition:.25s}
.celebrate.on{opacity:1}.celebrate div{background:var(--win);color:#fff;padding:22px 34px;border-radius:24px;font-size:28px;font-weight:900;text-align:center;box-shadow:0 10px 40px #f59e0b66;transform:scale(.8);transition:.25s}.celebrate.on div{transform:none}
.celebrate small{display:block;font-size:14px;opacity:.9}
body.big .players{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}body.big .pl .mn{font-size:76px}body.big .wrap,body.big .top,body.big .gfoot{max-width:1400px}
</style></head><body>

<!-- HOME -->
<section id="vHome">
 <div class="wrap">
  <div class="hero"><div class="logo">SCORE ROOM</div><p>みんなのスマホで得点を共有。21ルール対応。</p></div>
  <div class="card">
   <p class="lbl">ルームに参加</p>
   <input class="field" id="jName" placeholder="ニックネーム" autocomplete="nickname" style="margin-bottom:10px">
   <input class="field" id="jId" placeholder="ルームID（6桁）" inputmode="numeric" maxlength="6" style="margin-bottom:12px;letter-spacing:.2em;font-weight:800">
   <button class="btn pri" id="bJoin">参加する</button>
  </div>
  <div class="or">または</div>
  <button class="btn pri" id="bCreate" style="margin-bottom:10px">＋ ルームを作成</button>
  <button class="btn" id="bLocal">この端末だけで使う</button>
  <button class="btn hide" id="bResume" style="margin-top:10px">前回の続きから</button>
 </div>
</section>

<!-- SETUP -->
<section id="vSetup" class="hide">
 <div class="top"><button class="back" id="sBack">‹</button><h1 id="sTitle">ルールを選ぶ</h1><span class="chip hide" id="sRoom"></span></div>
 <div class="wrap" style="padding-top:0">
  <div class="steps"><div id="st1"></div><div id="st2"></div><div id="st3"></div></div>
  <!-- step1 -->
  <div id="step1">
   <div class="search"><input class="field" id="rSearch" placeholder="ルール名で検索（例：7○3×、updown）" style="margin-bottom:10px"><div class="chips" id="rCats"></div></div>
   <div class="rlist" id="rList"></div>
  </div>
  <!-- step2 -->
  <div id="step2" class="hide">
   <div class="desc" id="rDesc"></div>
   <div class="card" id="prmCard"><p class="lbl">ルール設定</p><div id="prmBox"></div></div>
   <div class="card"><p class="lbl">進行</p>
    <div class="prm"><span>勝ち抜け人数<br><small style="color:var(--mut);font-weight:500">0 = 制限なし</small></span><div class="stp" data-k="winLimit"></div></div>
    <label class="tog"><span>残りが枠以下になったら全員勝ち抜け</span><span class="sw"><input type="checkbox" id="autoRemain"><i></i></span></label>
    <label class="tog"><span>誤答が出たら次の問題へ（1問1解答）</span><span class="sw"><input type="checkbox" id="wrongEnds"><i></i></span></label>
   </div>
  </div>
  <!-- step3 -->
  <div id="step3" class="hide">
   <div class="card hide" id="guestCard"><p class="lbl">ルームに来ている人（タップで追加）</p><div id="guestBox"></div></div>
   <div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><p class="lbl" style="margin:0">プレイヤー</p><div class="stp" id="pCount"></div></div>
    <div id="memBox"></div></div>
  </div>
 </div>
 <div class="foot"><div class="in"><button class="btn pri" id="sNext">次へ</button></div></div>
</section>

<!-- GAME -->
<section id="vGame" class="hide">
 <div class="top"><h1>SCORE ROOM</h1><span class="chip hide" id="tChip"><span class="timer" id="timer">00:00</span></span><button class="chip" id="gRoom"><span class="dot"></span><span id="gRoomTx">ローカル</span></button></div>
 <div class="wrap" style="padding-top:0">
  <div class="gbar"><span class="qno" id="qNo">Q1</span><span class="rname" id="rName"></span></div>
  <div id="alert" class="alert hide"></div>
  <div class="players" id="players"></div>
  <div class="card" style="margin-top:16px"><p class="lbl">ログ</p><div class="log" id="log"></div></div>
 </div>
 <div class="foot"><div class="gfoot"><button id="gUndo">↶ 戻す</button><button class="thr" id="gThru">スルー ›</button><button id="gMenu">⋯ メニュー</button></div></div>
</section>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="in"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>
<div class="celebrate" id="cele"><div id="celeTx"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ===== ルール定義 =====
// 各ルール: name, cat, desc, params[{k,l,d,min,max}], init(p,P), onC(ctx), onW(ctx), view(p,P)->{main,sub}, win(p,P), lose(p,P), reach(p,P)->{win,lose}
// 共通: p.c 正解数, p.w 誤答数, p.s 得点, p.rest 休み残り
const RULES = {
 free:{name:'スコア計算',cat:'基本',desc:'勝敗判定なし。正解で+a点、誤答で−b点。',
  params:[{k:'a',l:'正解の点',d:1},{k:'b',l:'誤答の点',d:0}],
  onC:({p,P})=>{p.s+=P.a}, onW:({p,P})=>{p.s-=P.b},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`})},
 nomx:{name:'N○M×',cat:'基本',desc:'N回正解で勝ち抜け、M回誤答で失格。',
  params:[{k:'N',l:'勝ち抜け正解数',d:7},{k:'M',l:'失格誤答数',d:3}],
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P)=>({win:p.c===P.N-1,lose:p.w===P.M-1})},
 rentou:{name:'連答つきN○M×',cat:'基本',desc:'他人の正解・自分の誤答を挟まずに連続正解すると+2。Nポイントで勝ち抜け、M×で失格。（abc形式）',
  params:[{k:'N',l:'勝ち抜けポイント',d:7},{k:'M',l:'失格誤答数',d:3}],
  onC:({p,st})=>{p.s+= (st.streak===p.id?2:1)},
  view:(p,P,st)=>({main:p.s+'pt',sub:p.w+'×'+(st.streak===p.id?' 〈連答権〉':'')}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P,st)=>({win:p.s>=P.N-(st.streak===p.id?2:1),lose:p.w===P.M-1})},
 nomrest:{name:'N○M休',cat:'基本',desc:'N回正解で勝ち抜け。誤答するとM問休み（失格なし）。',
  params:[{k:'N',l:'勝ち抜け正解数',d:7},{k:'M',l:'誤答時の休み',d:1}],
  onW:({p,P,setRest})=>setRest(p,P.M),
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,reach:(p,P)=>({win:p.c===P.N-1})},
 newyork:{name:'NewYork',cat:'基本',desc:'正解+1、誤答−1。Nポイントで勝ち抜け。（M＞0ならMポイント以下で失格）',
  params:[{k:'N',l:'勝ち抜けポイント',d:10},{k:'M',l:'失格ライン（0で無し）',d:0}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s--},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>P.M>0&&p.s<=-P.M,
  reach:(p,P)=>({win:p.s===P.N-1,lose:P.M>0&&p.s===-P.M+1})},
 updown:{name:'Nupdown',cat:'abc / 大会',desc:'正解で+1、誤答すると0に戻る。Nポイントで勝ち抜け、M回誤答で失格。',
  params:[{k:'N',l:'勝ち抜けポイント',d:10},{k:'M',l:'失格誤答数',d:2}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s=0},
  view:(p)=>({main:p.s+'pt',sub:p.w+'×'}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P)=>({win:p.s===P.N-1,lose:p.w===P.M-1})},
 by:{name:'NbyN',cat:'abc / 大会',desc:'α=正解数、β=N−誤答数。α×βがN×N以上で勝ち抜け、βが0で失格。',
  params:[{k:'N',l:'N',d:10}],
  view:(p,P)=>{const a=p.c,b=P.N-p.w;return{main:(a*b)+'',sub:`${a} × ${b}`}},
  win:(p,P)=>p.c*(P.N-p.w)>=P.N*P.N,lose:(p,P)=>P.N-p.w<=0,
  reach:(p,P)=>({win:(p.c+1)*(P.N-p.w)>=P.N*P.N,lose:P.N-p.w===1})},
 freeze:{name:'freezeX',cat:'abc / 大会',desc:'X問正解で勝ち抜け。n回目の誤答でn回休み。',
  params:[{k:'N',l:'勝ち抜け正解数',d:10}],
  onW:({p,setRest})=>setRest(p,p.w),
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,reach:(p,P)=>({win:p.c===P.N-1})},
 swedish:{name:'Swedish10',cat:'abc / 大会',desc:'10問正解で勝ち抜け。誤答時、その時点の正解数で×が増える（0問:1× / 1〜2問:2× / 3〜5問:3× / 6〜9問:4×）。10×で失格。',
  params:[{k:'N',l:'勝ち抜け正解数',d:10},{k:'M',l:'失格×数',d:10}],
  onW:({p})=>{const c=p.c;p.x+= c===0?1:c<=2?2:c<=5?3:4},init:(p)=>{p.x=0},
  view:(p)=>({main:p.c+'○',sub:p.x+'×'}),win:(p,P)=>p.c>=P.N,lose:(p,P)=>p.x>=P.M,
  reach:(p,P)=>({win:p.c===P.N-1,lose:p.x+(p.c===0?1:p.c<=2?2:p.c<=5?3:4)>=P.M})},
 divide:{name:'Divide',cat:'abc / 大会',desc:'正解で+a点。n回目の誤答で得点が1/(n+1)（切り捨て）。目標点で勝ち抜け。',

 backstream:{name:'Backstream',cat:'abc / 大会',desc:'正解で+1、n回目の誤答で−n。Nポイントで勝ち抜け、−Mポイント以下で失格。',

 square:{name:'SquareX',cat:'abc / 大会',desc:'奇数問目の正解数 × 偶数問目の正解数 がX以上で勝ち抜け。M回誤答で失格。',

 rengoto:{name:'連誤答つきN○M×',cat:'abc / 大会',desc:'誤答でディスアドを得る。ディスアドを持ったまま誤答すると2×。正解でディスアド解除。',

 hits:{name:'hits Combo',cat:'abc / 大会',desc:'n連答目の正解でn点（他人の正解・自分の誤答でコンボが切れる）。N点で勝ち抜け、M×で失格。',

  view:(p,P,st)=>({main:p.s+'pt',sub:`${p.w}× / ${st.streak===p.id?p.combo+'コンボ中':'コンボなし'}`}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,

 attack:{name:'アタックサバイバル',cat:'サバイバル',desc:'全員L点から。正解すると他の全員が−a、誤答すると自分が−b。0点で失格（0未満にはならない）。',

  init:(p,P)=>{p.s=P.L},onC:({p,P,st})=>{st.players.forEach(o=>{if(o!==p&&!o.res)o.s=Math.max(0,o.s-P.a)})},onW:({p,P})=>{p.s=Math.max(0,p.s-P.b)},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),lose:(p)=>p.s<=0,reach:(p,P)=>({lose:p.s<=P.b})},
 variables:{name:'Variables',cat:'その他',desc:'各プレイヤーが変動値Vを決める（プレイヤー設定で変更）。正解で+V、誤答で−2V。目標点で勝ち抜け。',

  view:(p)=>({main:p.s+'pt',sub:`V=${p.v} / ${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.T,reach:(p,P)=>({win:p.s+p.v>=P.T})},
 triple:{name:'トリプルセブン',cat:'その他',desc:'7○3×のセットを繰り返し、先にSセット取った人の勝ち。誤答失格者はそのセット中のみ解答不可。',

 timerace:{name:'タイムレース',cat:'その他',desc:'制限時間内の得点を競う。正解+1、誤答−1。タイマーを使ってください。',
  params:[{k:'m',l:'制限時間（分）',d:5}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s--},view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`})},
 lucky:{name:'ラッキーショット',cat:'オリジナル',desc:'問題ごとに各プレイヤーの「正解点」と「誤答ダメージ」を1〜Xでランダム決定。目標点で勝ち抜け、ダメージが許容量以上で失格。',
  params:[{k:'X',l:'乱数の最大',d:3},{k:'T',l:'目標点',d:10},{k:'D',l:'ダメージ許容量',d:6}],
  init:(p)=>{p.dmg=0},onC:({p,st})=>{p.s+=roll(st,p,0)},onW:({p,st})=>{p.dmg+=roll(st,p,1)},
  view:(p,P,st)=>({main:p.s+'pt',sub:`ダメ ${p.dmg}/${P.D}　次: +${roll(st,p,0)} / −${roll(st,p,1)}`}),
  win:(p,P)=>p.s>=P.T,lose:(p,P)=>p.dmg>=P.D,reach:(p,P,st)=>({win:p.s+roll(st,p,0)>=P.T,lose:p.dmg+roll(st,p,1)>=P.D})},
 melon:{name:'メロンパン',cat:'オリジナル',desc:'全員ライフLから。正解者が指名した相手のライフ−a、誤答者は自分のライフ−b。0で失格。残りが勝ち抜け人数以下で終了。',

 koban:{name:'コバンザメ',cat:'オリジナル',desc:'ボタン2番目の人（セカンド）を選ぶ。正解: セカンド有→両者+1、無→+2。誤答: セカンド有→自分−1・セカンド−2、無→−2。0未満なし。',
  params:[{k:'N',l:'勝ち抜け点',d:7}],pick:'second',

  onW:({p,st,ex})=>{const s=st.players.find(o=>o.id===ex.second);if(s){p.s=Math.max(0,p.s-1);s.s=Math.max(0,s.s-2)}else p.s=Math.max(0,p.s-2)},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.N,reach:(p,P)=>({win:p.s>=P.N-2})},

function endSet(st,winner){winner.set++;st.players.forEach(o=>{o.sc=0;o.sw=0});st.log.push(`${winner.name} がセット獲得（${winner.set}セット目）`)}
function roll(st,p,k){ // 決定的な乱数（問題番号・プレイヤー・種類）
  let h=(st.seed^(st.q*2654435761)^(hashStr(p.id)*40503)^(k*97))>>>0;
  h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;
  return 1+(h%st.P.X);
}
function hashStr(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h}

// ===== 状態の再計算（履歴を最初から再生） =====
function replay(cfg,actions){
  const R=RULES[cfg.rule],P=cfg.params;
  const st={q:1,streak:null,seed:cfg.seed||1,P,log:[],wins:0,loses:0,ended:false,players:[]};
  st.players=cfg.players.map(pl=>{const p={id:pl.id,name:pl.name,c:0,w:0,s:0,rest:0,restQ:-1,res:null,rank:null,tried:-1,v:pl.v??(R.pvar?R.pvar.d:0)};R.init&&R.init(p,P);return p});
  const setRest=(p,n)=>{p.rest=n;p.restQ=st.q};
  const nextQ=()=>{st.players.forEach(p=>{if(p.rest>0&&p.restQ!==st.q)p.rest--});st.q++};
  const judge=()=>{
    for(const p of st.players){ if(p.res)continue;
      if(R.lose&&R.lose(p,P,st)){p.res='lose';st.loses++;p.order=st.loses;st.log.push(`${p.name} 失格`)}
      else if(R.win&&R.win(p,P,st)){p.res='win';st.wins++;p.rank=st.wins;st.log.push(`${p.name} 勝ち抜け（${st.wins}位）`)}
    }
    const active=st.players.filter(p=>!p.res);
    const lim=cfg.winLimit||0;
    if(lim>0&&st.wins>=lim){st.ended=true}
    else if(active.length>0&&(R.survival||cfg.autoRemain)&&lim>0&&active.length<=lim-st.wins){
      active.sort((a,b)=>b.s-a.s||b.c-a.c||a.w-b.w).forEach(p=>{p.res='win';st.wins++;p.rank=st.wins});st.log.push('残りのプレイヤーが勝ち抜け');st.ended=true}
    else if(active.length===0)st.ended=true;
  };
  for(const a of actions){
    if(st.ended&&a.t!=='note')continue;
    const p=st.players.find(x=>x.id===a.p);
    if(a.t==='c'&&p&&!p.res){p.c++;R.onC&&R.onC({p,P,st,ex:a,setRest});st.streak=p.id;st.log.push(`Q${st.q} ${p.name} ○`);judge();nextQ()}
    else if(a.t==='w'&&p&&!p.res){p.w++;R.onW&&R.onW({p,P,st,ex:a,setRest});p.tried=st.q;if(st.streak===p.id)st.streak=null;st.log.push(`Q${st.q} ${p.name} ×`);judge();if(cfg.wrongEnds)nextQ()}
    else if(a.t==='s'){st.log.push(`Q${st.q} スルー`);nextQ()}
  }
  st.players.forEach(p=>{p.reach=(!p.res&&R.reach)?R.reach(p,P,st):{}});
  return st;
}

<script>
const SHORT={free:'勝敗なし。点数だけ数える',nomx:'N回正解で抜け、M回誤答で失格',rentou:'連続正解で+2（abc）',nomrest:'誤答でM問休み',newyork:'正解+1／誤答−1',updown:'誤答で0に戻る',by:'正解数×(N−誤答数)',freeze:'n回目の誤答でn回休み',swedish:'正解数が多いほど誤答が重い',divide:'誤答で得点を割る',backstream:'n回目の誤答で−n',square:'奇数問×偶数問の正解数',rengoto:'連続誤答で2×',hits:'n連答目でn点',attack:'正解で他人を削る',variables:'自分で変動値を決める',triple:'7○3×を3セット先取',timerace:'時間内の得点勝負',lucky:'点数とダメージがランダム',melon:'指名した相手のライフを削る',koban:'2番目に押した人も得点'};

// ---------- sheet ----------

// ---------- stepper widget ----------
function stepper(el,get,set,min=0,max=999){el.innerHTML='<button>−</button><output></output><button>＋</button>';const o=el.querySelector('output');const r=()=>o.textContent=get();r();
 const [m,p]=el.querySelectorAll('button');let iv;const go=d=>{set(Math.min(max,Math.max(min,get()+d)));r()};
 [[m,-1],[p,1]].forEach(([b,d])=>{b.onclick=()=>go(d);b.onpointerdown=()=>{iv=setTimeout(function rep(){go(d);iv=setTimeout(rep,80)},450)};b.onpointerup=b.onpointerleave=()=>clearTimeout(iv)})}

 let items=[];

 else for(const k in RULES){const R=RULES[k];if(cat!=='すべて'&&cat!=='定番'&&R.cat!==cat)continue;
   const hay=(R.name+SHORT[k]+R.desc+k).toLowerCase();if(q&&!hay.includes(q)&&!PRESETS.some(p=>p[0]===k&&p[2].toLowerCase().includes(q)))continue;items.push({k,n:R.name,s:SHORT[k]})}
 $('#rList').innerHTML=items.map((it,i)=>`<button class="ritem ${cfg.rule===it.k&&!it.p?'sel':''}" data-i="${i}"><span class="ic">${ICON[it.k]}</span><span><b>${esc(it.n)}</b><small>${esc(it.s)}</small></span><span class="ar">›</span></button>`).join('')||'<p style="padding:20px;color:var(--mut);text-align:center">見つかりません</p>';

$('#rSearch').oninput=renderRules;

 stepper($('#pCount'),()=>cfg.players.length,v=>{while(cfg.players.length<v)cfg.players.push({id:uid(),name:'プレイヤー'+(cfg.players.length+1)});while(cfg.players.length>v)cfg.players.pop();renderMembers()},1,30);
 $('#memBox').innerHTML=cfg.players.map((p,i)=>`<div class="mem"><span class="no">${i+1}</span><input value="${esc(p.name)}" data-i="${i}" enterkeyhint="next">${R.pvar?`<input class="v" type="number" value="${p.v??R.pvar.d}" data-v="${i}" title="${R.pvar.l}">`:''}<button class="x" data-d="${i}">✕</button></div>`).join('');
 $('#memBox').querySelectorAll('[data-i]').forEach(inp=>{inp.onfocus=()=>{if(/^プレイヤー\d+$/.test(inp.value))inp.select()};inp.oninput=()=>cfg.players[inp.dataset.i].name=inp.value;
  inp.onkeydown=e=>{if(e.key==='Enter'){const n=$('#memBox').querySelector(`[data-i="${+inp.dataset.i+1}"]`);n?n.focus():inp.blur()}}});
 $('#memBox').querySelectorAll('[data-v]').forEach(inp=>inp.oninput=()=>cfg.players[inp.dataset.v].v=Number(inp.value));
 $('#memBox').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(cfg.players.length>1){cfg.players.splice(b.dataset.d,1);renderMembers()}})}
$('#sBack').onclick=()=>{if(step>1&&!(editing==='members'&&step===3))gotoSetup(step-1);else if(editing&&cfg){editing=false;cfg=cfgBak||cfg;show('vGame');render()}else leave()};
$('#sNext').onclick=()=>{const done=(editing==='rule'&&step===2)||step===3;if(!done)return gotoSetup(step+1);
 cfg.players.forEach((p,i)=>{if(!p.name.trim())p.name='プレイヤー'+(i+1)});
 const ids=new Set(cfg.players.map(p=>p.id));
 const apply=reset=>{editing=false;prevRes={};show('vGame');
  if(role==='guest'){hostConn&&hostConn.send({type:'cfg',cfg,reset});toast('変更を送りました');return}
  actions=reset?[]:actions.filter(a=>(!a.p||ids.has(a.p))&&(!a.target||ids.has(a.target))&&(!a.second||ids.has(a.second)));commit();toast('変更しました')};
 if(editing&&actions.length)openSheet(`<h3>今の得点はどうしますか？</h3><p style="color:var(--mut);font-size:14px;line-height:1.7;margin:0 0 16px">残す場合は、これまでの○×を新しいルールで計算し直します。</p><div style="display:grid;gap:10px"><button class="btn pri" data-keep>得点を残して変更</button><button class="btn" data-r style="color:var(--ng)">リセットして変更</button></div>`,b=>{b.querySelector('[data-keep]').onclick=()=>{closeSheet();apply(false)};b.querySelector('[data-r]').onclick=()=>{closeSheet();apply(true)}});
 else apply(true)};
// ---------- game ----------
function tally(){const t={};cfg.players.forEach(p=>t[p.id]={c:0,w:0});actions.forEach(a=>{if(t[a.p]){if(a.t==='c')t[a.p].c++;if(a.t==='w')t[a.p].w++}});return t}
function statsSheet(){const t=tally(),q=replay(cfg,actions).q-1;const rows=cfg.players.map(p=>({n:p.name,...t[p.id]})).sort((a,b)=>b.c-a.c||a.w-b.w);
 openSheet(`<h3>個人成績</h3><p style="color:var(--mut);font-size:13px;margin:-6px 0 12px">出題 ${q}問　｜　ルールに関係なく押した回数で集計</p><table style="width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums"><tr style="color:var(--mut);font-size:12px"><th style="text-align:left;padding:6px 4px">名前</th><th>正解</th><th>誤答</th><th>正答率</th></tr>${rows.map(r=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px 4px;font-weight:700">${esc(r.n)}</td><td style="text-align:center;color:var(--ok);font-weight:800">${r.c}</td><td style="text-align:center;color:var(--ng);font-weight:800">${r.w}</td><td style="text-align:center">${r.c+r.w?Math.round(r.c/(r.c+r.w)*100)+'%':'-'}</td></tr>`).join('')}</table>`)}
function render(){if(!cfg)return;const R=RULES[cfg.rule],P=cfg.params,st=replay(cfg,actions),TL=tally();
 $('#qNo').textContent='Q'+st.q;$('#rName').textContent=R.name+'　'+R.params.map(x=>x.k+'='+P[x.k]).join(' ');
 const rw=st.players.filter(p=>p.reach.win).map(p=>p.name),rl=st.players.filter(p=>p.reach.lose).map(p=>p.name);
 const al=$('#alert');al.className='alert';
 if(st.ended){const w=st.players.filter(p=>p.res==='win').sort((a,b)=>a.rank-b.rank).map(p=>p.name);al.classList.add('end');al.textContent='🏁 終了'+(w.length?'　'+w.join('・')+' 勝ち抜け':'')}
 else{const a=[];if(rw.length)a.push(rw.join('、')+' リーチ');if(rl.length)a.push(rl.join('、')+' 失格リーチ');if(a.length)al.textContent=a.join('　｜　');else al.classList.add('hide')}
 const box=$('#players');box.innerHTML='';
 st.players.forEach(p=>{const v=R.view(p,P,st),rest=p.rest>0&&!p.res,blocked=(R.blocked&&R.blocked(p,P))||p.tried===st.q;
  let tag='';if(p.res==='win')tag=`<span class="tag t-win">${p.rank}位 抜け</span>`;else if(p.res==='lose')tag='<span class="tag t-lose">失格</span>';else if(rest)tag=`<span class="tag t-rest">休み${p.rest}</span>`;else if(p.reach.win||p.reach.lose)tag=`<span class="tag t-reach">${p.reach.win?'リーチ':'失格リーチ'}</span>`;
  const d=document.createElement('div');d.className='pl'+(p.res?' '+p.res:'')+(rest?' rest':'')+(role==='guest'&&p.name===myName?' me':'');
  d.innerHTML=`<div class="hd"><span class="nm">${esc(p.name)}</span>${tag}</div><div class="mn">${v.main}</div><div class="sb">${esc(v.sub||'')}</div><div class="tot"><span>○${TL[p.id]?TL[p.id].c:0}</span><span>×${TL[p.id]?TL[p.id].w:0}</span></div>`;
  if(canEdit()){const dis=!!p.res||rest||blocked||st.ended;const bt=document.createElement('div');bt.className='bt';bt.innerHTML=`<button class="o" ${dis?'disabled':''}>○</button><button class="x" ${dis?'disabled':''}>×</button>`;
   bt.children[0].onclick=()=>{d.classList.add('pop');act('c',p.id)};bt.children[1].onclick=()=>{d.classList.add('pop');act('w',p.id)};d.appendChild(bt)}
  box.appendChild(d);
  if(p.res==='win'&&prevRes[p.id]!=='win'&&Object.keys(prevRes).length)celebrate(p.name,p.rank+'位 勝ち抜け');
  prevRes[p.id]=p.res||'-'});
 $('#log').innerHTML=st.log.slice().reverse().map(esc).join('<br>')||'まだ記録はありません';
 $('#gUndo').disabled=$('#gThru').disabled=!canEdit()||!actions.length&&false;
 $('#gRoomTx').textContent=mode==='online'?(role==='host'?'ID '+roomId+'・'+conns.length+'人':'ID '+roomId):'ローカル';
 $('#gRoom').classList.toggle('on',mode==='online')}
function celebrate(n,s){$('#celeTx').innerHTML=`${esc(n)}<small>${s}</small>`;$('#cele').classList.add('on');buzz([60,40,60]);setTimeout(()=>$('#cele').classList.remove('on'),1400)}
function act(t,p){const R=RULES[cfg.rule];buzz(t==='c'?20:[20,30,20]);
 const others=replay(cfg,actions).players.filter(o=>o.id!==p&&!o.res);
 if(t==='c'&&R.pick==='target')return pickP('誰を攻撃しますか？',others,false,id=>send({t,p,target:id}));
 if(R.pick==='second')return pickP('2番目に押した人は？',others,true,id=>send({t,p,second:id}));
 send({t,p})}
function pickP(title,list,none,cb){openSheet(`<h3>${title}</h3><div class="pickg">${list.map(o=>`<button data-id="${o.id}">${esc(o.name)}</button>`).join('')}${none?'<button data-id="" style="background:var(--ac);color:#fff">いない</button>':''}</div>`,b=>b.querySelectorAll('button').forEach(x=>x.onclick=()=>{closeSheet();cb(x.dataset.id||null)}))}
function send(a){if(role==='host'){actions.push(a);commit()}else hostConn&&hostConn.send({type:'act',a})}
$('#gThru').onclick=()=>send({t:'s'});
$('#gUndo').onclick=()=>{if(role==='host'){if(!actions.length)return toast('戻せる操作がありません');actions.pop();prevRes={};commit();toast('1つ戻しました')}else hostConn&&hostConn.send({type:'undo'})};
$('#gMenu').onclick=()=>{const host=role==='host';
 openSheet(`<h3>メニュー</h3>
 ${mode==='online'?'<button class="mi" data-a="share"><span class="e">🔗</span>参加リンクを共有</button>':(host?'<button class="mi" data-a="online"><span class="e">📡</span>オンラインにする（ルームを作成）</button>':'')}
 <button class="mi" data-a="timer"><span class="e">⏱</span>タイマー</button>
 <button class="mi" data-a="big"><span class="e">🖥</span>大画面表示 ${document.body.classList.contains('big')?'をやめる':''}</button>
 ${canEdit()?'<button class="mi" data-a="rule"><span class="e">⚙</span>ルールを変更</button><button class="mi" data-a="members"><span class="e">👥</span>プレイヤーを編集</button>':''}
 <button class="mi" data-a="stats"><span class="e">📊</span>個人成績（正解数・誤答数）</button>
 ${host&&mode==='online'?`<button class="mi" data-a="guest"><span class="e">✋</span>参加者の操作：${allowGuest?'許可中':'禁止中'}</button>`:''}
 ${host?'<button class="mi danger" data-a="reset"><span class="e">↺</span>得点をリセット</button>':''}
 <button class="mi danger" data-a="leave"><span class="e">⎋</span>${host?'ルームを閉じる':'退出する'}</button>`,b=>b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>menu(x.dataset.a)))};
function menu(a){closeSheet();
 if(a==='share')shareRoom();
 if(a==='online')createRoom(true);
 if(a==='timer')timerSheet();
 if(a==='big')document.body.classList.toggle('big');
 if(a==='rule'){editing='rule';cfgBak=cfg;cfg=JSON.parse(JSON.stringify(cfg));$('#rSearch').value='';gotoSetup(1)}
 if(a==='members'){editing='members';cfgBak=cfg;cfg=JSON.parse(JSON.stringify(cfg));gotoSetup(3)}
 if(a==='stats')statsSheet();
 if(a==='guest'){allowGuest=!allowGuest;commit();toast(allowGuest?'参加者も○×を押せます':'ホストだけが操作できます')}
 if(a==='reset')ask('得点をリセット','全員の得点と履歴を消して、最初からやり直します。','リセット',()=>{actions=[];prevRes={};commit()},true);
 if(a==='leave')ask(role==='host'?'ルームを閉じますか？':'退出しますか？',role==='host'?'得点はこの端末に保存され、次回「前回の続きから」で再開できます。':'ホームに戻ります。','はい',leave,true)}
$('#gRoom').onclick=()=>{if(mode==='online')shareRoom();else if(role==='host')createRoom(true)};
function shareRoom(){const url=location.href.split('#')[0]+'#'+roomId;
 openSheet(`<h3>ルームに招待</h3><div class="roomid">${roomId}</div><p style="text-align:center;color:var(--mut);font-size:13px;margin:-6px 0 16px">このIDをホームの「ルームに参加」に入力</p><button class="btn pri" data-s>リンクを送る</button><button class="btn" data-c style="margin-top:10px">リンクをコピー</button>`,b=>{
  b.querySelector('[data-s]').onclick=async()=>{try{await navigator.share({title:'SCORE ROOM',text:'ルームID '+roomId,url})}catch(e){navigator.clipboard?.writeText(url);toast('リンクをコピーしました')}};
  b.querySelector('[data-c]').onclick=()=>{navigator.clipboard?.writeText(url);toast('リンクをコピーしました')}})}
function timerSheet(){const running=!!timerEnd,paused=timerLeft!=null;
 openSheet(`<h3>タイマー</h3>${running||paused?`<div class="roomid" style="letter-spacing:.04em">${$('#timer').textContent}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn pri" data-t="toggle">${running?'一時停止':'再開'}</button><button class="btn" data-t="stop">リセット</button></div>`:
 `<div class="pickg">${[1,3,5,10,15,20].map(m=>`<button data-m="${m}">${m}分</button>`).join('')}</div>`}`,b=>{
  b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{timerLeft=null;timerEnd=Date.now()+x.dataset.m*60000;startTick();closeSheet()});
  const tg=b.querySelector('[data-t="toggle"]');if(tg)tg.onclick=()=>{if(timerEnd){timerLeft=timerEnd-Date.now();timerEnd=null;clearInterval(timerIv)}else{timerEnd=Date.now()+timerLeft;timerLeft=null;startTick()}closeSheet()};
  const sp=b.querySelector('[data-t="stop"]');if(sp)sp.onclick=()=>{timerEnd=null;timerLeft=null;clearInterval(timerIv);$('#tChip').classList.add('hide');closeSheet()}})}
function startTick(){clearInterval(timerIv);$('#tChip').classList.remove('hide');timerIv=setInterval(tick,250);tick()}
function tick(){const ms=timerEnd?timerEnd-Date.now():timerLeft;const s=Math.max(0,Math.ceil(ms/1000));$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 if(timerEnd&&ms<=0){clearInterval(timerIv);timerEnd=null;timerLeft=null;toast('⏱ タイムアップ！');buzz([300,100,300])}}
$('#tChip').onclick=timerSheet;
// ---------- network ----------
function commit(){save();render();conns.forEach(c=>{try{c.open&&c.send({type:'state',cfg,actions,allowGuest})}catch(e){}})}
function createRoom(fromGame){
 if(typeof Peer==='undefined'){toast('通信できません。この端末だけで使います');return fromGame?0:startLocal()}
 roomId=String(Math.floor(100000+Math.random()*900000));peer=new Peer('scoreroom-'+roomId);toast('ルームを作成中…');
 peer.on('open',()=>{mode='online';role='host';history.replaceState(null,'','#'+roomId);if(fromGame){render();shareRoom()}else startHost()});
 peer.on('error',e=>{if(e.type==='unavailable-id')createRoom(fromGame);else toast('通信エラー：'+e.type)});
 peer.on('connection',c=>{c.on('open',()=>{conns.push(c);c.send({type:'state',cfg,actions,allowGuest});render()});
  c.on('data',d=>{if(d.type==='hello'&&d.name){if(!guestNames.includes(d.name))guestNames.push(d.name);toast(d.name+' さんが参加しました');if(!$('#vSetup').classList.contains('hide')&&step===3)renderMembers()}
   if(!allowGuest)return;if(d.type==='act'){actions.push(d.a);commit()}if(d.type==='undo'&&actions.length){actions.pop();prevRes={};commit()}
   if(d.type==='cfg'&&d.cfg){const ids=new Set(d.cfg.players.map(p=>p.id));cfg=d.cfg;actions=d.reset?[]:actions.filter(a=>(!a.p||ids.has(a.p))&&(!a.target||ids.has(a.target))&&(!a.second||ids.has(a.second)));prevRes={};commit();toast('ルールが変更されました')}});
  c.on('close',()=>{conns=conns.filter(x=>x!==c);render()})})}
function joinRoom(id,name){
 if(typeof Peer==='undefined')return toast('通信できません');
 roomId=id;myName=name;peer=new Peer();toast('接続中…');
 peer.on('open',()=>{hostConn=peer.connect('scoreroom-'+id,{reliable:true});
  hostConn.on('open',()=>{role='guest';mode='online';hostConn.send({type:'hello',name});show('vGame');$('#players').innerHTML='<p style="color:var(--mut)">ホストがルールを設定中です…</p>'});
  hostConn.on('data',d=>{if(d.type==='state'){if(editing)return;cfg=d.cfg;actions=d.actions;allowGuest=d.allowGuest;show('vGame');render()}});
  hostConn.on('close',()=>toast('ホストとの接続が切れました'))});
 peer.on('error',e=>toast(e.type==='peer-unavailable'?'ルームが見つかりません':'通信エラー：'+e.type))}
function startHost(){$('#rSearch').value='';cfg=defaultCfg();actions=[];editing=false;prevRes={};commit();show('vGame');if(mode==='online')toast('ルームID '+roomId+'　ルールはメニューから変更できます');else toast('ルールはメニューから変更できます')}
function startLocal(){mode='local';role='host';roomId='';startHost()}
function leave(){try{peer&&peer.destroy()}catch(e){}peer=null;conns=[];hostConn=null;mode='local';role='host';roomId='';history.replaceState(null,'',location.pathname);show('vHome');homeInit()}
$('#bCreate').onclick=()=>createRoom(false);$('#bLocal').onclick=startLocal;
$('#bResume').onclick=()=>{const s=JSON.parse(localStorage.getItem('scoreroom2'));cfg=s.cfg;actions=s.actions||[];mode='local';role='host';prevRes={};show('vGame');render();
 render()};
$('#bJoin').onclick=()=>{const n=$('#jName').value.trim(),id=$('#jId').value.trim();if(!n){$('#jName').focus();return toast('ニックネームを入力してください')}if(!/^\d{6}$/.test(id)){$('#jId').focus();return toast('6桁のルームIDを入力してください')}localStorage.setItem('scoreroom-name',n);joinRoom(id,n)};
function homeInit(){$('#jName').value=localStorage.getItem('scoreroom-name')||'';const h=location.hash.match(/^#(\d{6})$/);if(h){$('#jId').value=h[1];setTimeout(()=>($('#jName').value?$('#bJoin'):$('#jName')).focus(),50)}
 $('#bResume').classList.toggle('hide',!localStorage.getItem('scoreroom2'))}
homeInit();
document.addEventListener('keydown',e=>{if($('#vGame').classList.contains('hide')||e.target.tagName==='INPUT')return;
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){$('#gUndo').click();e.preventDefault()}else if(e.key===' '){$('#gThru').click();e.preventDefault()}else if(e.key==='Escape')closeSheet()});
</script></body></html>
