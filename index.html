<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCORE ROOM｜クイズ得点共有</title>
<meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--mut:#94a3b8;--ac:#38bdf8;--ok:#22c55e;--ng:#ef4444;--win:#facc15;--rest:#a78bfa}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0b1222ee;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
header h1{font-size:17px;margin:0;letter-spacing:.06em}header .sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.on{color:#0b1222;background:var(--ac);border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
input,select{font:inherit;color:var(--tx);background:#0b1222;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#334155;color:var(--tx);font-weight:600}
button.pri{background:var(--ac);color:#0b1222}button.ok{background:var(--ok);color:#052e12}button.ng{background:var(--ng);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rules{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.rule{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#0b1222}
.rule.sel{border-color:var(--ac);box-shadow:0 0 0 2px #38bdf855}.rule b{display:block}.rule small{color:var(--mut);font-size:12px;line-height:1.5}
.cat{font-size:11px;color:var(--ac)}
.pcard{position:relative;border-radius:16px;padding:14px 12px 12px;background:var(--card);border:2px solid var(--line);text-align:center;transition:.2s}
.pcard .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .mn{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.pcard .sb{color:var(--mut);font-size:13px;min-height:18px}
.pcard .bt{display:flex;gap:6px;margin-top:10px}.pcard .bt button{flex:1;font-size:22px;padding:10px 0}
.pcard.win{border-color:var(--win);background:linear-gradient(160deg,#3b2f05,#1e293b)}.pcard.lose{opacity:.45;filter:grayscale(.8)}
.pcard.rest{border-color:var(--rest)}.pcard.rwin{box-shadow:0 0 0 3px #facc1566}.pcard.rlose{box-shadow:0 0 0 3px #ef444466}
.badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-win{background:var(--win);color:#3b2f05}.b-lose{background:var(--ng)}.b-rest{background:var(--rest);color:#1e1b4b}.b-reach{background:#f97316;color:#fff}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0b1222ee;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.bar button{min-width:96px}
.log{font-size:13px;color:var(--mut);max-height:140px;overflow:auto;line-height:1.7}
.banner{text-align:center;font-weight:800;font-size:20px;margin:0 0 12px;padding:10px;border-radius:12px;background:#0b1222;border:1px solid var(--line)}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}.modal .box{max-width:420px;width:100%}
.plist .it{display:flex;gap:6px;margin-bottom:6px}.plist .it input{flex:1}.plist .it .v{max-width:70px}
.muted{color:var(--mut);font-size:13px;line-height:1.6}.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
.big .pcard .mn{font-size:72px}.big .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}label.ck input{width:auto}
</style></head><body>
<header><h1>SCORE ROOM</h1><span class="sp"></span><span id="roomPill" class="pill hide"></span><span id="netPill" class="pill">ローカル</span></header>
<main>
<!-- ホーム -->
<section id="vHome">
 <div class="box"><h2>ルームに参加</h2>
  <div class="row"><input id="jName" placeholder="ニックネーム"><input id="jId" placeholder="ルームID（6桁）" inputmode="numeric" maxlength="6"></div>
  <div class="row" style="margin-top:8px"><button class="pri" id="bJoin">参加する</button></div></div>
 <div class="box"><h2>新しくルームを作成</h2>
  <p class="muted">作成した端末がホストになります。ルームIDを共有すると、参加者のスマホにも得点がリアルタイムで表示されます。</p>
  <div class="row"><button class="pri" id="bCreate">ルームを作成</button><button id="bLocal">この端末だけで使う</button></div></div>
 <p class="muted">21種類のルールに対応。履歴から毎回計算し直すので「元に戻す」は何回でも可能です。</p>
</section>
<!-- 設定 -->
<section id="vSetup" class="hide">
 <div class="box"><h2>ルール</h2><div id="ruleList" class="rules"></div></div>
 <div class="box"><h2 id="ruleTitle">設定</h2><p class="muted" id="ruleDesc"></p><div id="paramBox" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
  <div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
   <div><div class="muted">勝ち抜け人数（0=無制限）</div><input type="number" id="winLimit" min="0" value="0"></div></div>
  <div style="margin-top:10px" class="row">
   <label class="ck"><input type="checkbox" id="autoRemain" checked>残りが枠以下になったら全員勝ち抜け</label>
   <label class="ck"><input type="checkbox" id="wrongEnds">誤答でその問題を終了（1問1解答）</label></div></div>
 <div class="box"><h2>プレイヤー</h2><div id="plist" class="plist"></div>
  <div class="row"><button id="bAddP">＋ プレイヤー追加</button><button id="bAddMe" class="hide">参加者を取り込む</button></div></div>
 <div class="row"><button class="pri" id="bStart">この設定で開始</button></div>
</section>
<!-- 試合 -->
<section id="vGame" class="hide">
 <div id="banner" class="banner"></div>
 <div class="row" style="margin-bottom:12px"><span class="pill" id="qPill">Q1</span><span class="pill" id="rulePill"></span><span id="timerBox" class="hide" style="text-align:right"><span class="timer" id="timer">00:00</span></span></div>
 <div id="pgrid" class="grid"></div>
 <div class="box" style="margin-top:14px"><h2>ログ</h2><div class="log" id="log"></div></div>
</section>
</main>
<div class="bar hide" id="gbar">
 <button id="bThrough">スルー（次の問題）</button><button id="bUndo">元に戻す</button><button id="bTimer">タイマー</button><button id="bBig">大画面</button><button id="bShare">共有</button><button id="bSet">設定</button>
</div>
<div class="modal" id="mPick"><div class="box"><h2 id="pickTitle"></h2><div id="pickList" class="grid" style="grid-template-columns:1fr 1fr"></div><div class="row" style="margin-top:10px"><button id="pickCancel">キャンセル</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ===== ルール定義 =====
// 各ルール: name, cat, desc, params[{k,l,d,min,max}], init(p,P), onC(ctx), onW(ctx), view(p,P)->{main,sub}, win(p,P), lose(p,P), reach(p,P)->{win,lose}
// 共通: p.c 正解数, p.w 誤答数, p.s 得点, p.rest 休み残り
const RULES = {
 free:{name:'スコア計算',cat:'基本',desc:'勝敗判定なし。正解で+a点、誤答で−b点。',
  params:[{k:'a',l:'正解の点',d:1},{k:'b',l:'誤答の点',d:0}],
  onC:({p,P})=>{p.s+=P.a}, onW:({p,P})=>{p.s-=P.b},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`})},
 nomx:{name:'N○M×',cat:'基本',desc:'N回正解で勝ち抜け、M回誤答で失格。',
  params:[{k:'N',l:'勝ち抜け正解数',d:7},{k:'M',l:'失格誤答数',d:3}],
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P)=>({win:p.c===P.N-1,lose:p.w===P.M-1})},
 rentou:{name:'連答つきN○M×',cat:'基本',desc:'他人の正解・自分の誤答を挟まずに連続正解すると+2。Nポイントで勝ち抜け、M×で失格。（abc形式）',
  params:[{k:'N',l:'勝ち抜けポイント',d:7},{k:'M',l:'失格誤答数',d:3}],
  onC:({p,st})=>{p.s+= (st.streak===p.id?2:1)},
  view:(p,P,st)=>({main:p.s+'pt',sub:p.w+'×'+(st.streak===p.id?' 〈連答権〉':'')}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P,st)=>({win:p.s>=P.N-(st.streak===p.id?2:1),lose:p.w===P.M-1})},
 nomrest:{name:'N○M休',cat:'基本',desc:'N回正解で勝ち抜け。誤答するとM問休み（失格なし）。',
  params:[{k:'N',l:'勝ち抜け正解数',d:7},{k:'M',l:'誤答時の休み',d:1}],
  onW:({p,P,setRest})=>setRest(p,P.M),
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,reach:(p,P)=>({win:p.c===P.N-1})},
 newyork:{name:'NewYork',cat:'基本',desc:'正解+1、誤答−1。Nポイントで勝ち抜け。（M＞0ならMポイント以下で失格）',
  params:[{k:'N',l:'勝ち抜けポイント',d:10},{k:'M',l:'失格ライン（0で無し）',d:0}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s--},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>P.M>0&&p.s<=-P.M,
  reach:(p,P)=>({win:p.s===P.N-1,lose:P.M>0&&p.s===-P.M+1})},
 updown:{name:'Nupdown',cat:'abc / 大会',desc:'正解で+1、誤答すると0に戻る。Nポイントで勝ち抜け、M回誤答で失格。',
  params:[{k:'N',l:'勝ち抜けポイント',d:10},{k:'M',l:'失格誤答数',d:2}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s=0},
  view:(p)=>({main:p.s+'pt',sub:p.w+'×'}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P)=>({win:p.s===P.N-1,lose:p.w===P.M-1})},
 by:{name:'NbyN',cat:'abc / 大会',desc:'α=正解数、β=N−誤答数。α×βがN×N以上で勝ち抜け、βが0で失格。',
  params:[{k:'N',l:'N',d:10}],
  view:(p,P)=>{const a=p.c,b=P.N-p.w;return{main:(a*b)+'',sub:`${a} × ${b}`}},
  win:(p,P)=>p.c*(P.N-p.w)>=P.N*P.N,lose:(p,P)=>P.N-p.w<=0,
  reach:(p,P)=>({win:(p.c+1)*(P.N-p.w)>=P.N*P.N,lose:P.N-p.w===1})},
 freeze:{name:'freezeX',cat:'abc / 大会',desc:'X問正解で勝ち抜け。n回目の誤答でn回休み。',
  params:[{k:'N',l:'勝ち抜け正解数',d:10}],
  onW:({p,setRest})=>setRest(p,p.w),
  view:(p)=>({main:p.c+'○',sub:p.w+'×'}),win:(p,P)=>p.c>=P.N,reach:(p,P)=>({win:p.c===P.N-1})},
 swedish:{name:'Swedish10',cat:'abc / 大会',desc:'10問正解で勝ち抜け。誤答時、その時点の正解数で×が増える（0問:1× / 1〜2問:2× / 3〜5問:3× / 6〜9問:4×）。10×で失格。',
  params:[{k:'N',l:'勝ち抜け正解数',d:10},{k:'M',l:'失格×数',d:10}],
  onW:({p})=>{const c=p.c;p.x+= c===0?1:c<=2?2:c<=5?3:4},init:(p)=>{p.x=0},
  view:(p)=>({main:p.c+'○',sub:p.x+'×'}),win:(p,P)=>p.c>=P.N,lose:(p,P)=>p.x>=P.M,
  reach:(p,P)=>({win:p.c===P.N-1,lose:p.x+(p.c===0?1:p.c<=2?2:p.c<=5?3:4)>=P.M})},
 divide:{name:'Divide',cat:'abc / 大会',desc:'正解で+a点。n回目の誤答で得点が1/(n+1)（切り捨て）。目標点で勝ち抜け。',
  params:[{k:'T',l:'目標点',d:100},{k:'a',l:'正解の点',d:10}],
  onC:({p,P})=>{p.s+=P.a},onW:({p})=>{p.s=Math.floor(p.s/(p.w+1))},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.T,reach:(p,P)=>({win:p.s+P.a>=P.T})},
 backstream:{name:'Backstream',cat:'abc / 大会',desc:'正解で+1、n回目の誤答で−n。Nポイントで勝ち抜け、−Mポイント以下で失格。',
  params:[{k:'N',l:'勝ち抜けポイント',d:10},{k:'M',l:'失格ライン',d:10}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s-=p.w},
  view:(p)=>({main:p.s+'pt',sub:`次の誤答 −${p.w+1}`}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.s<=-P.M,
  reach:(p,P)=>({win:p.s===P.N-1,lose:p.s-(p.w+1)<=-P.M})},
 square:{name:'SquareX',cat:'abc / 大会',desc:'奇数問目の正解数 × 偶数問目の正解数 がX以上で勝ち抜け。M回誤答で失格。',
  params:[{k:'X',l:'目標',d:16},{k:'M',l:'失格誤答数',d:3}],
  init:(p)=>{p.od=0;p.ev=0},onC:({p,st})=>{if(st.q%2===1)p.od++;else p.ev++},
  view:(p)=>({main:(p.od*p.ev)+'',sub:`奇${p.od} × 偶${p.ev} / ${p.w}×`}),win:(p,P)=>p.od*p.ev>=P.X,lose:(p,P)=>p.w>=P.M,
  reach:(p,P)=>({win:Math.max((p.od+1)*p.ev,p.od*(p.ev+1))>=P.X,lose:p.w===P.M-1})},
 rengoto:{name:'連誤答つきN○M×',cat:'abc / 大会',desc:'誤答でディスアドを得る。ディスアドを持ったまま誤答すると2×。正解でディスアド解除。',
  params:[{k:'N',l:'勝ち抜け正解数',d:7},{k:'M',l:'失格×数',d:3}],
  init:(p)=>{p.x=0;p.dis=false},onC:({p})=>{p.dis=false},onW:({p})=>{p.x+=p.dis?2:1;p.dis=true},
  view:(p)=>({main:p.c+'○',sub:p.x+'×'+(p.dis?' ⚠ディスアド':'')}),win:(p,P)=>p.c>=P.N,lose:(p,P)=>p.x>=P.M,
  reach:(p,P)=>({win:p.c===P.N-1,lose:p.x+(p.dis?2:1)>=P.M})},
 hits:{name:'hits Combo',cat:'abc / 大会',desc:'n連答目の正解でn点（他人の正解・自分の誤答でコンボが切れる）。N点で勝ち抜け、M×で失格。',
  params:[{k:'N',l:'勝ち抜け点',d:10},{k:'M',l:'失格誤答数',d:3}],
  init:(p)=>{p.combo=0},onC:({p,st})=>{p.combo= st.streak===p.id?p.combo+1:1;p.s+=p.combo},onW:({p})=>{p.combo=0},
  view:(p,P,st)=>({main:p.s+'pt',sub:`${p.w}× / ${st.streak===p.id?p.combo+'コンボ中':'コンボなし'}`}),win:(p,P)=>p.s>=P.N,lose:(p,P)=>p.w>=P.M,
  reach:(p,P,st)=>({win:p.s+(st.streak===p.id?p.combo+1:1)>=P.N,lose:p.w===P.M-1})},
 attack:{name:'アタックサバイバル',cat:'サバイバル',desc:'全員L点から。正解すると他の全員が−a、誤答すると自分が−b。0点で失格（0未満にはならない）。',
  params:[{k:'L',l:'持ち点',d:15},{k:'a',l:'正解時の他者ダメージ',d:1},{k:'b',l:'誤答時の自分ダメージ',d:2}],survival:true,
  init:(p,P)=>{p.s=P.L},onC:({p,P,st})=>{st.players.forEach(o=>{if(o!==p&&!o.res)o.s=Math.max(0,o.s-P.a)})},onW:({p,P})=>{p.s=Math.max(0,p.s-P.b)},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),lose:(p)=>p.s<=0,reach:(p,P)=>({lose:p.s<=P.b})},
 variables:{name:'Variables',cat:'その他',desc:'各プレイヤーが変動値Vを決める（プレイヤー設定で変更）。正解で+V、誤答で−2V。目標点で勝ち抜け。',
  params:[{k:'T',l:'目標点',d:20}],pvar:{k:'v',l:'変動値V',d:2},
  onC:({p})=>{p.s+=p.v},onW:({p})=>{p.s-=2*p.v},
  view:(p)=>({main:p.s+'pt',sub:`V=${p.v} / ${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.T,reach:(p,P)=>({win:p.s+p.v>=P.T})},
 triple:{name:'トリプルセブン',cat:'その他',desc:'7○3×のセットを繰り返し、先にSセット取った人の勝ち。誤答失格者はそのセット中のみ解答不可。',
  params:[{k:'N',l:'セット勝ち正解数',d:7},{k:'M',l:'セット失格誤答数',d:3},{k:'S',l:'勝利セット数',d:3}],
  init:(p)=>{p.set=0;p.sc=0;p.sw=0},
  onC:({p,P,st})=>{p.sc++;if(p.sc>=P.N)endSet(st,p)},
  onW:({p,P,st})=>{p.sw++;const alive=st.players.filter(o=>!o.res&&o.sw<P.M);if(alive.length===1)endSet(st,alive[0])},
  blocked:(p,P)=>p.sw>=P.M,
  view:(p,P)=>({main:p.set+'セット',sub:`${p.sc}○ ${p.sw}×`+(p.sw>=P.M?' (セット失格)':'')}),win:(p,P)=>p.set>=P.S,
  reach:(p,P)=>({win:p.set===P.S-1&&p.sc===P.N-1})},
 timerace:{name:'タイムレース',cat:'その他',desc:'制限時間内の得点を競う。正解+1、誤答−1。タイマーを使ってください。',
  params:[{k:'m',l:'制限時間（分）',d:5}],
  onC:({p})=>{p.s++},onW:({p})=>{p.s--},view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`})},
 lucky:{name:'ラッキーショット',cat:'オリジナル',desc:'問題ごとに各プレイヤーの「正解点」と「誤答ダメージ」を1〜Xでランダム決定。目標点で勝ち抜け、ダメージが許容量以上で失格。',
  params:[{k:'X',l:'乱数の最大',d:3},{k:'T',l:'目標点',d:10},{k:'D',l:'ダメージ許容量',d:6}],
  init:(p)=>{p.dmg=0},onC:({p,st})=>{p.s+=roll(st,p,0)},onW:({p,st})=>{p.dmg+=roll(st,p,1)},
  view:(p,P,st)=>({main:p.s+'pt',sub:`ダメ ${p.dmg}/${P.D}　次: +${roll(st,p,0)} / −${roll(st,p,1)}`}),
  win:(p,P)=>p.s>=P.T,lose:(p,P)=>p.dmg>=P.D,reach:(p,P,st)=>({win:p.s+roll(st,p,0)>=P.T,lose:p.dmg+roll(st,p,1)>=P.D})},
 melon:{name:'メロンパン',cat:'オリジナル',desc:'全員ライフLから。正解者が指名した相手のライフ−a、誤答者は自分のライフ−b。0で失格。残りが勝ち抜け人数以下で終了。',
  params:[{k:'L',l:'ライフ',d:5},{k:'a',l:'攻撃ダメージ',d:1},{k:'b',l:'誤答ダメージ',d:1}],survival:true,pick:'target',
  init:(p,P)=>{p.s=P.L},onC:({P,st,ex})=>{const t=st.players.find(o=>o.id===ex.target);if(t)t.s=Math.max(0,t.s-P.a)},onW:({p,P})=>{p.s=Math.max(0,p.s-P.b)},
  view:(p)=>({main:'♥'+p.s,sub:`${p.c}○ ${p.w}×`}),lose:(p)=>p.s<=0,reach:(p,P)=>({lose:p.s<=Math.max(P.a,P.b)})},
 koban:{name:'コバンザメ',cat:'オリジナル',desc:'ボタン2番目の人（セカンド）を選ぶ。正解: セカンド有→両者+1、無→+2。誤答: セカンド有→自分−1・セカンド−2、無→−2。0未満なし。',
  params:[{k:'N',l:'勝ち抜け点',d:7}],pick:'second',
  onC:({p,st,ex})=>{const s=st.players.find(o=>o.id===ex.second);if(s){p.s++;s.s++}else p.s+=2},
  onW:({p,st,ex})=>{const s=st.players.find(o=>o.id===ex.second);if(s){p.s=Math.max(0,p.s-1);s.s=Math.max(0,s.s-2)}else p.s=Math.max(0,p.s-2)},
  view:(p)=>({main:p.s+'pt',sub:`${p.c}○ ${p.w}×`}),win:(p,P)=>p.s>=P.N,reach:(p,P)=>({win:p.s>=P.N-2})},
};
function endSet(st,winner){winner.set++;st.players.forEach(o=>{o.sc=0;o.sw=0});st.log.push(`${winner.name} がセット獲得（${winner.set}セット目）`)}
function roll(st,p,k){ // 決定的な乱数（問題番号・プレイヤー・種類）
  let h=(st.seed^(st.q*2654435761)^(hashStr(p.id)*40503)^(k*97))>>>0;
  h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;
  return 1+(h%st.P.X);
}
function hashStr(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h}

// ===== 状態の再計算（履歴を最初から再生） =====
function replay(cfg,actions){
  const R=RULES[cfg.rule],P=cfg.params;
  const st={q:1,streak:null,seed:cfg.seed||1,P,log:[],wins:0,loses:0,ended:false,players:[]};
  st.players=cfg.players.map(pl=>{const p={id:pl.id,name:pl.name,c:0,w:0,s:0,rest:0,restQ:-1,res:null,rank:null,tried:-1,v:pl.v??(R.pvar?R.pvar.d:0)};R.init&&R.init(p,P);return p});
  const setRest=(p,n)=>{p.rest=n;p.restQ=st.q};
  const nextQ=()=>{st.players.forEach(p=>{if(p.rest>0&&p.restQ!==st.q)p.rest--});st.q++};
  const judge=()=>{
    for(const p of st.players){ if(p.res)continue;
      if(R.lose&&R.lose(p,P,st)){p.res='lose';st.loses++;p.order=st.loses;st.log.push(`${p.name} 失格`)}
      else if(R.win&&R.win(p,P,st)){p.res='win';st.wins++;p.rank=st.wins;st.log.push(`${p.name} 勝ち抜け（${st.wins}位）`)}
    }
    const active=st.players.filter(p=>!p.res);
    const lim=cfg.winLimit||0;
    if(lim>0&&st.wins>=lim){st.ended=true}
    else if(active.length>0&&(R.survival||cfg.autoRemain)&&lim>0&&active.length<=lim-st.wins){
      active.sort((a,b)=>b.s-a.s||b.c-a.c||a.w-b.w).forEach(p=>{p.res='win';st.wins++;p.rank=st.wins});st.log.push('残りのプレイヤーが勝ち抜け');st.ended=true}
    else if(active.length===0)st.ended=true;
  };
  for(const a of actions){
    if(st.ended&&a.t!=='note')continue;
    const p=st.players.find(x=>x.id===a.p);
    if(a.t==='c'&&p&&!p.res){p.c++;R.onC&&R.onC({p,P,st,ex:a,setRest});st.streak=p.id;st.log.push(`Q${st.q} ${p.name} ○`);judge();nextQ()}
    else if(a.t==='w'&&p&&!p.res){p.w++;R.onW&&R.onW({p,P,st,ex:a,setRest});p.tried=st.q;if(st.streak===p.id)st.streak=null;st.log.push(`Q${st.q} ${p.name} ×`);judge();if(cfg.wrongEnds)nextQ()}
    else if(a.t==='s'){st.log.push(`Q${st.q} スルー`);nextQ()}
  }
  st.players.forEach(p=>{p.reach=(!p.res&&R.reach)?R.reach(p,P,st):{}});
  return st;
}


</script>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
let cfg=null,actions=[],mode='local',role='host',peer=null,conns=[],hostConn=null,myName='',allowGuest=true,timerEnd=null,timerLeft=null,timerIv=null,guestNames=[];
const save=()=>{if(role==='host')localStorage.setItem('scoreroom',JSON.stringify({cfg,actions}))};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const show=v=>{['vHome','vSetup','vGame'].forEach(x=>$('#'+x).classList.toggle('hide',x!==v));$('#gbar').classList.toggle('hide',v!=='vGame')};
const canEdit=()=>role==='host'||allowGuest;
function defaultCfg(){return{rule:'nomx',params:{},players:[{id:uid(),name:'プレイヤー1'},{id:uid(),name:'プレイヤー2'},{id:uid(),name:'プレイヤー3'}],winLimit:0,autoRemain:true,wrongEnds:false,seed:Math.floor(Math.random()*1e9)}}
// ---- 設定画面 ----
function renderSetup(){
 const rl=$('#ruleList');rl.innerHTML='';
 for(const k in RULES){const R=RULES[k];const d=document.createElement('div');d.className='rule'+(cfg.rule===k?' sel':'');
  d.innerHTML=`<span class="cat">${R.cat}</span><b>${R.name}</b><small>${R.desc}</small>`;d.onclick=()=>{cfg.rule=k;cfg.params={};renderSetup()};rl.appendChild(d)}
 const R=RULES[cfg.rule];$('#ruleTitle').textContent=R.name+' の設定';$('#ruleDesc').textContent=R.desc;
 const pb=$('#paramBox');pb.innerHTML='';
 R.params.forEach(x=>{if(cfg.params[x.k]==null)cfg.params[x.k]=x.d;const w=document.createElement('div');w.innerHTML=`<div class="muted">${x.l}</div>`;const i=document.createElement('input');i.type='number';i.value=cfg.params[x.k];i.oninput=()=>cfg.params[x.k]=Number(i.value);w.appendChild(i);pb.appendChild(w)});
 $('#winLimit').value=cfg.winLimit;$('#autoRemain').checked=cfg.autoRemain;$('#wrongEnds').checked=cfg.wrongEnds;
 const pl=$('#plist');pl.innerHTML='';
 cfg.players.forEach((p,i)=>{const it=document.createElement('div');it.className='it';
  const n=document.createElement('input');n.value=p.name;n.oninput=()=>p.name=n.value;it.appendChild(n);
  if(R.pvar){const v=document.createElement('input');v.className='v';v.type='number';v.title=R.pvar.l;v.value=p.v??R.pvar.d;v.oninput=()=>p.v=Number(v.value);it.appendChild(v)}
  const up=document.createElement('button');up.textContent='↑';up.onclick=()=>{if(i>0){[cfg.players[i-1],cfg.players[i]]=[cfg.players[i],cfg.players[i-1]];renderSetup()}};it.appendChild(up);
  const del=document.createElement('button');del.textContent='✕';del.onclick=()=>{cfg.players.splice(i,1);renderSetup()};it.appendChild(del);pl.appendChild(it)});
 $('#bAddMe').classList.toggle('hide',!guestNames.length);
}
$('#winLimit').oninput=e=>cfg.winLimit=Number(e.target.value);$('#autoRemain').onchange=e=>cfg.autoRemain=e.target.checked;$('#wrongEnds').onchange=e=>cfg.wrongEnds=e.target.checked;
$('#bAddP').onclick=()=>{cfg.players.push({id:uid(),name:'プレイヤー'+(cfg.players.length+1)});renderSetup()};
$('#bAddMe').onclick=()=>{guestNames.forEach(n=>{if(!cfg.players.some(p=>p.name===n))cfg.players.push({id:uid(),name:n})});renderSetup()};
$('#bStart').onclick=()=>{
 if(actions.length&&!confirm('得点をリセットして開始しますか？\n（キャンセルで得点を残したままルールだけ変更）')){}else actions=[];
 cfg.seed=cfg.seed||Math.floor(Math.random()*1e9);commit();show('vGame')};
// ---- 試合画面 ----
function render(){
 if(!cfg)return;const R=RULES[cfg.rule],P=cfg.params;const st=replay(cfg,actions);
 $('#qPill').textContent='Q'+st.q;$('#rulePill').textContent=R.name+' '+R.params.map(x=>x.k+'='+P[x.k]).join(' ');
 const g=$('#pgrid');g.innerHTML='';
 const reachW=st.players.filter(p=>p.reach.win).map(p=>p.name),reachL=st.players.filter(p=>p.reach.lose).map(p=>p.name);
 let ban='';if(st.ended){const w=st.players.filter(p=>p.res==='win').sort((a,b)=>a.rank-b.rank).map(p=>p.name);ban='終了！ '+(w.length?w.join('・')+' 勝ち抜け':'')}
 else{const a=[];if(reachW.length)a.push(reachW.join('、')+' リーチ');if(reachL.length)a.push(reachL.join('、')+' 失格リーチ');ban=a.join('　/　')}
 $('#banner').textContent=ban;$('#banner').classList.toggle('hide',!ban);
 st.players.forEach(p=>{
  const v=R.view(p,P,st);const d=document.createElement('div');
  const rest=p.rest>0&&!p.res;const blocked=(R.blocked&&R.blocked(p,P))||p.tried===st.q;
  d.className='pcard'+(p.res?' '+p.res:'')+(rest?' rest':'')+(p.reach.win?' rwin':'')+(p.reach.lose?' rlose':'');
  let badge='';if(p.res==='win')badge=`<span class="badge b-win">勝ち抜け ${p.rank}位</span>`;else if(p.res==='lose')badge=`<span class="badge b-lose">失格</span>`;else if(rest)badge=`<span class="badge b-rest">休み ${p.rest}</span>`;else if(p.reach.win||p.reach.lose)badge=`<span class="badge b-reach">${p.reach.win?'リーチ':'失格リーチ'}</span>`;
  d.innerHTML=`${badge}<div class="nm">${esc(p.name)}</div><div class="mn">${v.main}</div><div class="sb">${v.sub||''}</div>`;
  if(canEdit()){const bt=document.createElement('div');bt.className='bt';
   const c=document.createElement('button');c.className='ok';c.textContent='○';const w=document.createElement('button');w.className='ng';w.textContent='×';
   const dis=!!p.res||rest||blocked||st.ended;c.disabled=w.disabled=dis;
   c.onclick=()=>act('c',p.id);w.onclick=()=>act('w',p.id);bt.append(c,w);d.appendChild(bt)}
  g.appendChild(d)});
 $('#log').innerHTML=st.log.slice().reverse().map(esc).join('<br>');
 $('#bThrough').disabled=$('#bUndo').disabled=!canEdit();$('#bSet').classList.toggle('hide',role!=='host');
 $('#timerBox').classList.toggle('hide',timerLeft==null&&!timerEnd);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function act(t,p){const R=RULES[cfg.rule];
 if(p&&R.pick&&t==='c'&&R.pick==='target')return pick('攻撃する相手を選択',p,false,id=>send({t,p,target:id}));
 if(p&&R.pick==='second')return pick('セカンド（2番目に押した人）',p,true,id=>send({t,p,second:id}));
 send({t,p})}
function pick(title,self,allowNone,cb){const st=replay(cfg,actions);$('#pickTitle').textContent=title;const l=$('#pickList');l.innerHTML='';
 st.players.filter(o=>o.id!==self&&!o.res).forEach(o=>{const b=document.createElement('button');b.textContent=o.name;b.onclick=()=>{close();cb(o.id)};l.appendChild(b)});
 if(allowNone){const b=document.createElement('button');b.className='pri';b.textContent='セカンドなし';b.onclick=()=>{close();cb(null)};l.appendChild(b)}
 const close=()=>$('#mPick').classList.remove('on');$('#pickCancel').onclick=close;$('#mPick').classList.add('on')}
function send(a){if(role==='host'){actions.push(a);commit()}else if(hostConn)hostConn.send({type:'act',a})}
$('#bThrough').onclick=()=>send({t:'s'});
$('#bUndo').onclick=()=>{if(role==='host'){actions.pop();commit()}else hostConn&&hostConn.send({type:'undo'})};
$('#bSet').onclick=()=>{renderSetup();show('vSetup')};
$('#bBig').onclick=()=>document.body.classList.toggle('big');
$('#bShare').onclick=()=>{if(mode!=='online'){toast('ローカルモードです（ルーム作成で共有できます）');return}
 const url=location.href.split('#')[0]+'#'+roomId;navigator.clipboard?.writeText(url);toast('参加リンクをコピーしました：ルームID '+roomId)};
// ---- タイマー ----
$('#bTimer').onclick=()=>{
 if(timerEnd){timerLeft=timerEnd-Date.now();timerEnd=null;clearInterval(timerIv);render();return}
 if(timerLeft==null){const m=prompt('タイマー（分）',cfg.params.m||5);if(!m)return;timerLeft=Number(m)*60000}
 timerEnd=Date.now()+timerLeft;timerLeft=null;clearInterval(timerIv);timerIv=setInterval(tick,250);tick();render()};
function tick(){const ms=timerEnd?timerEnd-Date.now():timerLeft;if(ms==null)return;const s=Math.max(0,Math.ceil(ms/1000));$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 if(timerEnd&&ms<=0){clearInterval(timerIv);timerEnd=null;timerLeft=null;toast('タイムアップ！');try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}}
// ---- 通信（PeerJS） ----
let roomId='';
function commit(){save();render();broadcast()}
function broadcast(){conns.forEach(c=>{try{c.open&&c.send({type:'state',cfg,actions,allowGuest})}catch(e){}})}
function setNet(t,on){$('#netPill').textContent=t;$('#netPill').classList.toggle('on',!!on)}
function createRoom(){
 if(typeof Peer==='undefined'){toast('通信ライブラリを読み込めません。ローカルで起動します');return startLocal()}
 roomId=String(Math.floor(100000+Math.random()*900000));peer=new Peer('scoreroom-'+roomId);
 peer.on('open',()=>{mode='online';role='host';$('#roomPill').textContent='ルームID '+roomId;$('#roomPill').classList.remove('hide');setNet('ホスト',true);location.hash=roomId;afterStart()});
 peer.on('error',e=>{if(e.type==='unavailable-id')createRoom();else toast('通信エラー: '+e.type)});
 peer.on('connection',c=>{c.on('open',()=>{conns.push(c);c.send({type:'state',cfg,actions,allowGuest});setNet('ホスト・'+conns.length+'人接続',true)});
  c.on('data',d=>{if(d.type==='hello'&&d.name&&!guestNames.includes(d.name)){guestNames.push(d.name);toast(d.name+' が参加');if(!$('#vSetup').classList.contains('hide'))renderSetup()}
   if(!allowGuest)return;if(d.type==='act'){actions.push(d.a);commit()}if(d.type==='undo'){actions.pop();commit()}});
  c.on('close',()=>{conns=conns.filter(x=>x!==c);setNet('ホスト・'+conns.length+'人接続',true)})});
}
function joinRoom(id,name){
 if(typeof Peer==='undefined'){toast('通信ライブラリを読み込めません');return}
 roomId=id;myName=name;peer=new Peer();setNet('接続中…');
 peer.on('open',()=>{hostConn=peer.connect('scoreroom-'+id,{reliable:true});
  hostConn.on('open',()=>{role='guest';mode='online';setNet('参加中',true);$('#roomPill').textContent='ルームID '+id;$('#roomPill').classList.remove('hide');hostConn.send({type:'hello',name})});
  hostConn.on('data',d=>{if(d.type==='state'){cfg=d.cfg;actions=d.actions;allowGuest=d.allowGuest;show('vGame');render()}});
  hostConn.on('close',()=>{setNet('切断');toast('ホストとの接続が切れました')})});
 peer.on('error',e=>{toast(e.type==='peer-unavailable'?'ルームが見つかりません':'通信エラー: '+e.type);setNet('ローカル')});
}
function afterStart(){const s=JSON.parse(localStorage.getItem('scoreroom')||'null');
 if(s&&s.cfg&&confirm('前回の続きから始めますか？')){cfg=s.cfg;actions=s.actions||[];show('vGame');commit()}
 else{cfg=defaultCfg();actions=[];renderSetup();show('vSetup')}}
function startLocal(){mode='local';role='host';setNet('ローカル');afterStart()}
$('#bCreate').onclick=createRoom;$('#bLocal').onclick=startLocal;
$('#bJoin').onclick=()=>{const n=$('#jName').value.trim(),id=$('#jId').value.trim();if(!/^\d{6}$/.test(id))return toast('6桁のルームIDを入力');localStorage.setItem('scoreroom-name',n);joinRoom(id,n||'ゲスト')};
$('#jName').value=localStorage.getItem('scoreroom-name')||'';
if(/^#\d{6}$/.test(location.hash))$('#jId').value=location.hash.slice(1);
document.addEventListener('keydown',e=>{if($('#vGame').classList.contains('hide')||e.target.tagName==='INPUT')return;
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){$('#bUndo').click();e.preventDefault()}if(e.key===' '){$('#bThrough').click();e.preventDefault()}});
</script></body></html>
